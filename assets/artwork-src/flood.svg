    <path d="M170 700 q 55 -34 110 0 t 110 0 t 110 0 t 110 0 t 110 0 t 110 0" opacity="0.9"/>
    <path d="M220 780 q 55 -34 110 0 t 110 0 t 110 0 t 110 0 t 110 0" opacity="0.5"/>
