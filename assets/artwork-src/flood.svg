<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <!-- sensor puck -->
  <g>
    <ellipse cx="500" cy="520" rx="230" ry="70" fill="#c6d0d7"/>
    <rect x="270" y="380" width="460" height="140" rx="40" fill="#e9eef1"/>
    <rect x="270" y="380" width="460" height="140" rx="40" fill="none" stroke="#c6d0d7" stroke-width="6"/>
    <ellipse cx="500" cy="380" rx="230" ry="72" fill="#f4f7f9"/>
    <ellipse cx="500" cy="380" rx="230" ry="72" fill="none" stroke="#c6d0d7" stroke-width="6"/>
    <!-- top branding ring + LED -->
    <ellipse cx="500" cy="380" rx="150" ry="46" fill="none" stroke="#1470a6" stroke-width="10"/>
    <circle cx="500" cy="372" r="18" fill="#e5534b"/>
    <!-- droplet mark -->
