<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" fill="#ffffff"/>
  <!-- faucet coupling -->
  <g>
    <rect x="440" y="120" width="120" height="60" rx="10" fill="#9aa7b0"/>
    <rect x="425" y="170" width="150" height="34" rx="8" fill="#7d8b95"/>
    <rect x="455" y="200" width="90" height="40" fill="#b9c3ca"/>
  </g>
  <!-- timer body -->
  <rect x="290" y="238" width="420" height="520" rx="64" fill="#e9eef1"/>
  <rect x="290" y="238" width="420" height="520" rx="64" fill="none" stroke="#c6d0d7" stroke-width="6"/>
  <!-- face plate -->
  <rect x="330" y="300" width="340" height="330" rx="40" fill="#1470a6"/>
  <!-- dial -->
  <circle cx="500" cy="430" r="110" fill="#0d5580"/>
  <circle cx="500" cy="430" r="86" fill="#eaf4fb"/>
  <rect x="492" y="360" width="16" height="76" rx="8" fill="#1470a6"/>
  <circle cx="500" cy="430" r="14" fill="#1470a6"/>
  <!-- tick marks -->
  <g fill="#7fc4e8">
    <rect x="494" y="316" width="12" height="20" rx="6"/>
    <rect x="494" y="504" width="12" height="20" rx="6"/>
    <rect x="398" y="424" width="20" height="12" rx="6"/>
    <rect x="582" y="424" width="20" height="12" rx="6"/>
  </g>
  <!-- status LED + buttons -->
  <circle cx="400" cy="580" r="12" fill="#59d68f"/>
  <rect x="440" y="568" width="70" height="24" rx="12" fill="#7fc4e8"/>
  <rect x="530" y="568" width="70" height="24" rx="12" fill="#7fc4e8"/>
  <!-- hose outlet -->
  <rect x="440" y="758" width="120" height="46" rx="10" fill="#9aa7b0"/>
  <rect x="452" y="800" width="96" height="60" rx="16" fill="#7d8b95"/>
  <path d="M472 856 q 28 30 56 0" fill="none" stroke="#7d8b95" stroke-width="24" stroke-linecap="round"/>
  <!-- droplet accent -->
  <path d="M488 890 C 488 878, 500 862, 500 862 C 500 862, 512 878, 512 890 A 12 12 0 1 1 488 890 Z" fill="#1a86c8"/>
</svg>
